projects:
  - name: grocery_web_application
    environments:
      - name: production
        services:
          - type: web
            name: grocery-web-application-api
            runtime: node
            plan: free
            region: singapore
            autoDeployTrigger: off
            buildCommand: npm ci --include=dev && npm run build --workspace @vishwaneed/api
            startCommand: node apps/api/dist/main.js
            healthCheckPath: /api/v1/categories
            envVars:
              - key: NODE_ENV
                value: production
              - key: MONGODB_URI
                sync: false
              - key: MONGODB_DATABASE
                value: grocery_web_application
              - key: JWT_ACCESS_SECRET
                generateValue: true
              - key: JWT_REFRESH_SECRET
                generateValue: true
              - key: BANK_DATA_ENCRYPTION_KEY
                sync: false
              - key: CORS_ORIGINS
                sync: false
              - key: CUSTOMER_WEB_URL
                sync: false
              - key: ADMIN_EMAIL
                sync: false
              - key: ADMIN_PASSWORD
                sync: false
              - key: PRIVATE_UPLOAD_DIR
                value: /opt/render/project/src/apps/api/private-uploads
              - key: PUBLIC_UPLOAD_DIR
                value: /opt/render/project/src/apps/api/public-uploads
              - key: INTERAKT_API_URL
                value: https://api.interakt.ai/v1/public/message/
              - key: SETTLEMENT_DAYS
                value: "7"
              - key: RETURN_WINDOW_DAYS
                value: "7"
              - key: CHECKOUT_QUOTE_TTL_MINUTES
                value: "10"
